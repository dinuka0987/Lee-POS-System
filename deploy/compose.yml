name: lee-pos-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lee_pos}
    volumes: ['production_database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: .., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a connection URL using host postgres}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    build: { context: .., target: api }
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BRANCH_ID: ${BRANCH_ID:?Set BRANCH_ID}
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      API_PORT: 3000
      API_HOST: 0.0.0.0
      TRUST_PROXY: '1'
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ['3000']
    restart: unless-stopped
  gateway:
    build: { context: .., target: gateway }
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    depends_on:
      api: { condition: service_healthy }
    ports: ['80:80', '443:443']
    volumes: ['/etc/letsencrypt:/etc/letsencrypt:ro']
    restart: unless-stopped
volumes:
  production_database:
