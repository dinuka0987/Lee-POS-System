name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://lee:ci-local-only@localhost:5432/lee_pos_ci?schema=public
      BRANCH_ID: 00000000-0000-4000-8000-000000000001
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lee
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: lee_pos_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lee -d lee_pos_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
